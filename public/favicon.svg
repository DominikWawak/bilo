<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#f0ece5"/>
  <!-- Shadow offset behind card, centered in canvas -->
  <rect x="9" y="8" width="17" height="20" fill="#0a0a0a"/>
  <!-- White card, centered -->
  <rect x="6" y="5" width="17" height="20" fill="white" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Three lines, vertically distributed inside card -->
  <line x1="9" y1="12" x2="20" y2="12" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="9" y1="16" x2="21" y2="16" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="9" y1="20" x2="16" y2="20" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
</svg>
